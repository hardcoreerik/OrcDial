name: Firmware nightly

# Builds main for the M5Stack Dial when firmware-relevant files changed since the last nightly and
# the host tests pass, publishes it to the rolling `nightly` prerelease (merged .bin, ELF,
# SHA256SUMS, build-info.json), then tells theorc.dev (repository_dispatch if SITE_DISPATCH_TOKEN
# is set; theorc-site also polls hourly). Never touches release tags.
on:
  schedule:
    - cron: '27 10 * * *'   # 03:27 PDT / 02:27 PST (OrcSDR builds at :23)
  workflow_dispatch:
    inputs:
      force:
        description: 'Build and publish even if main has not changed'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: firmware-nightly
  cancel-in-progress: false

env:
  NIGHTLY_TAG: nightly

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.g.outputs.build }}
      sha: ${{ steps.g.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          base=$(python3 tools/ci/write-build-info.py --base-tag)
          ahead=$(git rev-list --count "$base..HEAD")
          last=""
          if gh release download "$NIGHTLY_TAG" -R "$GITHUB_REPOSITORY" -p build-info.json -O "$RUNNER_TEMP/bi.json" 2>/dev/null; then
            last=$(jq -r '.commit // ""' "$RUNNER_TEMP/bi.json")
          fi
          build=true; why="main changed"
          if [ "$ahead" = 0 ]; then build=false; why="main is exactly $base (theorc.dev shows 'same as release')"
          elif [ "$sha" = "$last" ]; then build=false; why="main unchanged since the last nightly"
          elif [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null; then
            # Docs and CI only (*.md, docs/, LICENSE, top-level dotfiles but .gitattributes/.gitmodules, .github/ except this workflow)
            # don't change the firmware. tools/ci/ and this file still build: they change how the image is made.
            fw=$(git diff --name-only "$last" "$sha" | awk '!/^docs\// && !/\.md$/ && !/^LICENSE$/ && (!/^\.[^\/]+$/ || /^\.git(attributes|modules)$/) &&
                 !(/^\.github\// && $0 != ".github/workflows/firmware-nightly.yml")')
            if [ -z "$fw" ]; then build=false; why="only docs/CI changed since the last nightly ${last:0:7}"; fi
          fi
          if [ "$FORCE" = true ]; then build=true; why="forced"; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "main ${sha:0:7}, last nightly ${last:0:7}, $ahead commits since $base: build=$build ($why)" | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      short: ${{ steps.meta.outputs.short }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'tools/ci/setup.sh') }}
      - name: Toolchain (PlatformIO, esptool, Mbed TLS 3.6)
        run: bash tools/ci/setup.sh
      - name: Tests and both firmware builds (tools/release_check.py, no hardware)
        run: python tools/release_check.py --mbedtls-source "$MBEDTLS_SOURCE" --pio pio
      - id: meta
        run: |
          short=$(git rev-parse --short=7 HEAD)
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "build_id=nightly $short $(TZ=America/Los_Angeles date +%F)" >> "$GITHUB_OUTPUT"
      - name: Build the release image
        run: bash tools/ci/build-dial.sh --out dist --build-id "${{ steps.meta.outputs.build_id }}" --name "OrcDial-M5Dial-nightly-${{ steps.meta.outputs.short }}"
      - name: Package
        env:
          SHORT: ${{ steps.meta.outputs.short }}
          BUILD_ID: ${{ steps.meta.outputs.build_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cd dist
          stem="OrcDial-M5Dial-nightly-$SHORT"
          zip -q -9 "$stem.elf.zip" "$stem.elf" && rm "$stem.elf"
          sha256sum "$stem.bin" "$stem.elf.zip" > SHA256SUMS.txt
          python3 ../tools/ci/write-build-info.py --channel nightly --build-id "$BUILD_ID" \
            --asset "$stem.bin" --run-url "$RUN_URL" --json build-info.json --notes notes.md
          ls -l
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly
          path: dist/
          retention-days: 7

  publish:
    needs: [gate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.gate.outputs.sha }}
      SHORT: ${{ needs.build.outputs.short }}
      HAS_DISPATCH: ${{ secrets.SITE_DISPATCH_TOKEN != '' }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nightly
          path: dist
      - name: Point the rolling tag at this commit
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$NIGHTLY_TAG" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$NIGHTLY_TAG" -f sha="$SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$NIGHTLY_TAG" -f sha="$SHA" >/dev/null
          fi
          if ! gh release view "$NIGHTLY_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$NIGHTLY_TAG" -R "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
              --title "OrcDial nightly (main)" --notes "Rolling build of main. Install: https://theorc.dev/dial/nightly/"
          fi
      - name: Upload assets, drop stale ones, then the build-info.json marker
        run: |
          set -euo pipefail
          cd dist
          bin="OrcDial-M5Dial-nightly-$SHORT.bin"; elfzip="OrcDial-M5Dial-nightly-$SHORT.elf.zip"
          gh release upload "$NIGHTLY_TAG" -R "$GITHUB_REPOSITORY" --clobber "$bin" "$elfzip" SHA256SUMS.txt
          gh release edit "$NIGHTLY_TAG" -R "$GITHUB_REPOSITORY" --prerelease --latest=false \
            --title "OrcDial nightly $SHORT ($(TZ=America/Los_Angeles date +%F))" --notes-file notes.md
          keep=" $bin $elfzip SHA256SUMS.txt build-info.json "
          gh release view "$NIGHTLY_TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | while read -r a; do
            case "$keep" in *" $a "*) ;; *) gh release delete-asset "$NIGHTLY_TAG" "$a" -R "$GITHUB_REPOSITORY" -y ;; esac
          done
          # The marker goes last: the gate skips a SHA once build-info.json names it.
          gh release upload "$NIGHTLY_TAG" -R "$GITHUB_REPOSITORY" --clobber build-info.json
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$NIGHTLY_TAG ($bin)" >> "$GITHUB_STEP_SUMMARY"
      - name: Notify theorc.dev
        if: env.HAS_DISPATCH == 'true'
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/hardcoreerik/theorc-site/dispatches \
            -d "{\"event_type\":\"orcdial-nightly\",\"client_payload\":{\"commit\":\"$SHA\"}}")
          if [ "$code" != 204 ]; then
            echo "::warning::theorc-site dispatch failed (HTTP $code); its hourly sync will pick the build up. Token expired?"
          fi
      - name: No SITE_DISPATCH_TOKEN
        if: env.HAS_DISPATCH != 'true'
        run: echo "SITE_DISPATCH_TOKEN not set; theorc.dev picks the build up on its hourly sync." >> "$GITHUB_STEP_SUMMARY"
